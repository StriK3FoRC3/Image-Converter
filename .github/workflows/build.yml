name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Image Converter
        shell: cmd
        run: build.bat
      - name: Upload runnable build
        uses: actions/upload-artifact@v4
        with:
          name: ImageConverter-Windows-x64
          path: build/
          if-no-files-found: error
