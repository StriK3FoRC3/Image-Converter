name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Image Converter
        shell: cmd
        run: build.bat
      - name: Create release archive
        shell: powershell
        run: |
          Compress-Archive -Path build\* -DestinationPath ImageConverter-Windows-x64.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::Open("ImageConverter-Windows-x64.zip", "Update")
          try {
            foreach ($folder in @("Input/", "Output/")) {
              if ($null -eq $archive.GetEntry($folder)) {
                $archive.CreateEntry($folder) | Out-Null
              }
            }
          } finally {
            $archive.Dispose()
          }
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ImageConverter-Windows-x64.zip --notes-file "release-notes/${{ github.ref_name }}.md" --title "Image Converter ${{ github.ref_name }}"
