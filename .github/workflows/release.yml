name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build Image Converter
        shell: cmd
        run: build.bat
      - name: Create release archive
        shell: powershell
        run: Compress-Archive -Path build\* -DestinationPath ImageConverter-Windows-x64.zip
      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ImageConverter-Windows-x64.zip --generate-notes --title "Image Converter ${{ github.ref_name }}"
